services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlflow/mlruns --default-artifact-root /mlflow/mlruns
    ports:
      - "5001:5000"
    volumes:
      - mlflow_data:/mlflow/mlruns

  pipeline:
    build: .
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - .:/app
      - ~/.kaggle/kaggle.json:/root/.kaggle/kaggle.json:ro
    stdin_open: true
    tty: true

volumes:
  mlflow_data:
